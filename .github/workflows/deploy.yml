name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # ערכים ציבוריים בלבד (מפתח publishable ומפתח VAPID ציבורי) — בטוח שיהיו כאן
      VITE_BASE: /Task_Manager/
      VITE_SUPABASE_URL: https://qclygsjrtulxfbjdzmpz.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_3vvDMG30kXrc3of_kctmnw__ZCLU7pc
      VITE_VAPID_PUBLIC_KEY: BBTPD6wKz9DfxiqoAkhzIwIRri1Tf4wRee1etJGZdmf6ZimPRVdLTuxqq5_YnfbmyHnLnDksA4wJBVulkhoP9-0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      # GitHub Pages לא תומך ב-rewrites — 404.html = index.html כדי שקישורים עמוקים יעבדו
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
